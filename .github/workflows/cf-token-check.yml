name: Cloudflare token check

# One-minute check that CLOUDFLARE_API_TOKEN can still reach the Workers API,
# so a dead token is found here instead of after a 45-minute export build.
# The token has silently lost Workers access twice (2026-09-23, 2026-10-15).
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN is empty"; exit 1; fi
          echo "token length: ${#CLOUDFLARE_API_TOKEN}"
          npx --yes wrangler@4 whoami
          npx --yes wrangler@4 deployments list -c cloudflare/condo-static/wrangler.cfs.jsonc | head -5
